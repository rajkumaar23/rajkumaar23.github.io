{{ define "main" }}
<header>
  <span class="rk-eyebrow">the shelf</span>
  <h1 class="mt-2 text-4xl font-extrabold text-neutral-900 dark:text-neutral">{{ .Title }}</h1>
</header>
<section class="mt-4 prose flex max-w-full flex-col dark:prose-invert lg:flex-row">
  <div class="min-h-0 min-w-0 max-w-prose grow">
    {{ .Content | emojify }}
  </div>
</section>

<section>
  <div id="shelf-loader" class="rk-loader" role="status" aria-label="Loading books"></div>
  <div id="books-grid">
    <div class="rk-shelf-block">
      <div class="rk-section-head">
        <div>
          <span class="rk-eyebrow">right now</span>
          <h2 class="rk-title" style="font-size: 1.4rem;">Currently reading</h2>
        </div>
      </div>
      <div id="books-currently-reading" class="rk-grid rk-grid-6"></div>
    </div>

    <div class="rk-shelf-block">
      <div class="rk-section-head">
        <div>
          <span class="rk-eyebrow">the tally</span>
          <h2 class="rk-title" style="font-size: 1.4rem;">Finished</h2>
        </div>
      </div>
      <div id="books-finished" class="rk-grid rk-grid-6"></div>
    </div>

    <div class="rk-shelf-block">
      <div class="rk-section-head">
        <div>
          <span class="rk-eyebrow">the queue</span>
          <h2 class="rk-title" style="font-size: 1.4rem;">Looking forward to</h2>
        </div>
      </div>
      <div id="books-want-to-read" class="rk-grid rk-grid-6"></div>
    </div>
  </div>
</section>

<script>
  function getBookArticleElement(book) {
    const formatter = new Intl.ListFormat('en', { style: 'short', type: 'conjunction' });
    const authors = formatter.format((book.authors || []).map((a) => a.name));
    const article = document.createElement("a");
    article.className = "rk-book rk-reveal rk-in";
    article.href = `https://literal.club/book/${book.slug}`;
    article.target = "_blank";
    article.rel = "noopener";
    article.setAttribute("aria-label", book.title);
    article.innerHTML = `
      <span class="rk-book-cover"><img alt="Cover of ${book.title}" src="${book.cover}" loading="lazy"></span>
      <span class="rk-book-title">${book.title}</span>
      <span class="rk-book-author">${authors}</span>`;
    return article;
  }

  async function fetchFromLiteralClub(readingStatus) {
    let response = await fetch('https://api.literal.club/', {
      method: 'POST', mode: 'cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query: `
          query booksByReadingStateAndHandle($limit: Int!, $offset: Int!, $readingStatus: ReadingStatus!, $handle: String!) {
              booksByReadingStateAndHandle(limit: $limit, offset: $offset, readingStatus: $readingStatus, handle: $handle) {
                  ...BookParts
                  __typename
              }
          }
          fragment BookParts on Book {
              id slug title subtitle description isbn10 isbn13 language pageCount
              publishedDate publisher physicalFormat cover
              authors { ...AuthorMini __typename }
              gradientColors workId __typename
          }
          fragment AuthorMini on Author { id name slug __typename }`,
        variables: { handle: "rajkumaar23", readingStatus: readingStatus, limit: 10000, offset: 0 },
      }),
    });
    response = await response.json();
    return response?.data?.booksByReadingStateAndHandle;
  }

  function fill(id, books) {
    document.getElementById(id).append(...(books || []).map(getBookArticleElement));
  }

  (async function () {
    try {
      const [reading, finished, want] = await Promise.all([
        fetchFromLiteralClub("IS_READING"),
        fetchFromLiteralClub("FINISHED"),
        fetchFromLiteralClub("WANTS_TO_READ"),
      ]);
      fill("books-currently-reading", reading);
      fill("books-finished", finished);
      fill("books-want-to-read", want);
    } finally {
      document.getElementById("shelf-loader").style.display = "none";
      document.getElementById("books-grid").style.display = "block";
    }
  })();
</script>
{{ end }}
