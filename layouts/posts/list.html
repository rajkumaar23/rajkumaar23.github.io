{{ define "main" }}
<header>
  <span class="rk-eyebrow">the blog</span>
  <h1 class="mt-2 text-4xl font-extrabold text-neutral-900 dark:text-neutral">{{ .Title }}</h1>
</header>
<section class="mt-4 prose flex max-w-full flex-col dark:prose-invert lg:flex-row">
  <div class="min-h-0 min-w-0 max-w-prose grow">
    {{ .Content | emojify }}
  </div>
</section>
<section class="mt-8">
  <div class="rk-grid rk-grid-3">
    {{ range .Pages }}
      {{ partial "rk/post-card.html" . }}
    {{ end }}
  </div>
</section>
{{ end }}
